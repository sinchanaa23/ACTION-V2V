name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest
      - name: Python share >= 95%
        run: python scripts/check_python_share.py --min 95
      - name: Real data sources only
        run: python scripts/check_data_sources.py
      - name: Frozen test split untouched
        if: github.event_name == 'pull_request'
        run: python scripts/check_test_split.py origin/${{ github.base_ref }}
      - name: Pipeline smoke run
        run: python -m v2v.pipeline --config proposed --seed 0

  # P3-06: config P on the real Hebbal network for 60 simulated seconds.
  # Runs on main and on demand only: it downloads the OSM corridor (cached by
  # snapshot date), so a slow Overpass server never blocks a PR.
  sim-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,sim]"
      - uses: actions/cache@v4
        with:
          path: sim_out/networks
          key: osm-${{ hashFiles('src/v2v/sim/osm_network.py') }}
      - name: Real network and one scenario
        run: python -m v2v.sim.scenarios --corridor hebbal --conditions noisy --densities low --seeds 0 --no-validate
      - name: Config P, first 60 simulated seconds
        run: >
          python -m v2v.eval.runner sim_out/scenarios/hebbal/noisy-low-s0 --fixtures
          --configs proposed --max-time 60 --out sim_out/results --name smoke
