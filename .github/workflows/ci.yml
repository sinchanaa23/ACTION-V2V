name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest
      - name: Python share >= 95%
        run: python scripts/check_python_share.py --min 95
      - name: Real data sources only
        run: python scripts/check_data_sources.py
      - name: Frozen test split untouched
        if: github.event_name == 'pull_request'
        run: python scripts/check_test_split.py origin/${{ github.base_ref }}
      - name: Pipeline smoke run
        run: python -m v2v.pipeline --config proposed --seed 0
