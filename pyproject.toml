[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "v2v"
version = "0.1.0"
description = "A.C.T.I.O.N-V2V: informal Indian driver reports to reliable V2V hazard warnings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# Install only what your module needs, e.g. pip install -e ".[dev,sim]"
data = [
    "praw>=7.7",
    "google-api-python-client>=2.100",
    "gspread>=6.0",
    "pandas>=2.1",
    "rapidfuzz>=3.5",
]
nlp = [
    "scikit-learn>=1.4",
    "torch>=2.2",
    "transformers>=4.40",
    "indic-transliteration>=2.3",
    "rapidfuzz>=3.5",
]
sim = [
    "eclipse-sumo>=1.20",
    "traci>=1.20",
    "sumolib>=1.20",
    "pyproj>=3.6",
    "rtree>=1.2",
    "osmnx>=1.9",
    "shapely>=2.0",
    "networkx>=3.2",
    "numpy>=1.26",
]
dashboard = ["streamlit>=1.35", "plotly>=5.20", "folium>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/v2v"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["v2v", "tests", "scripts"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/v2v"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# SUMO's Python tools ship without type hints and aren't installed in the base CI job.
module = ["sumo", "sumolib", "sumolib.*", "traci", "traci.*", "libsumo", "pyproj"]
ignore_missing_imports = true
